generations:
  - name: "First Generation"
    start_year: 2013
    end_year: 2016
    description: "The Ford Fusion Energi was a plug-in hybrid variant of the second-generation Fusion sedan, introduced in February 2013. It was built on the Ford CD4 platform and combined a 2.0L Atkinson cycle four-cylinder engine producing 141 HP with an electric motor rated at 118 HP, delivering a total system output of approximately 195 HP through a Ford HF35 eCVT transmission. The 7.6 kWh lithium-ion battery provided an EPA-rated all-electric range of 20 miles with a total range of 550 miles when combining electric and gasoline power. The Energi qualified for federal tax credits up to $3,750 and California HOV lane access. Visually identical to the standard Fusion except for the charge port door and Energi badging, it offered SE, Titanium, and Platinum trim levels with features including SYNC infotainment system, leather seating surfaces, and available adaptive cruise control and collision warning systems. Production ran from January 2013 through the 2016 model year before receiving a significant refresh."

  - name: "First Generation (2017 Facelift)"
    start_year: 2017
    end_year: 2020
    description: "A refreshed 2017 Fusion Energi was released by mid-2016, featuring a new front fascia design and significant technical upgrades. The updated model year received more efficient electric motors that increased the EPA-rated all-electric range from 20 to 22 miles while improving overall efficiency. The hybrid powertrain continued to pair the 2.0L four-cylinder engine with the eCVT transmission, maintaining approximately 195 HP total system output. The refreshed model also improved its EPA fuel economy ratings in hybrid mode to 42 MPG combined, up from 38 MPG. Interior updates included the latest SYNC 3 infotainment system with enhanced connectivity features and a revised center console layout. The 2017 facelift represented the final evolution of the Fusion Energi before production ended alongside all Ford Fusion models in 2020 as Ford shifted focus toward SUVs and fully electric vehicles. Total U.S. sales reached approximately 53,000 units over the model's lifecycle."